name: Update news

on:
  schedule:
    # 3時間おきに実行
    # （毎時17分ではなく、
    # 0,3,6,9,12,15,18,21時台の17分）
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update news with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - run: |
          git config user.name "gulf-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Hourly news update"
          git push
